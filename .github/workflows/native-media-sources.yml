name: GStreamer component source evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-sources:
    runs-on: windows-latest
    steps:
      - name: Check out exact source pin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download and verify pinned component archives
        shell: pwsh
        run: ./src-tauri/native-media/verify-gstreamer-sources.ps1 -DownloadDirectory (Join-Path $env:RUNNER_TEMP 'gstreamer-component-sources-1.28.6')
      - name: Retain verified component archives for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gstreamer-component-sources-${{ github.sha }}
          path: ${{ runner.temp }}/gstreamer-component-sources-1.28.6/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
