name: VLC ExperimentRunner Windows package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated installer as a public prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-install:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: experiments/vlc-flubber
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned offline package
        run: .\package.ps1
      - name: Install Inno Setup compiler
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        run: |
          $compiler = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          & $compiler .\installer.iss | Select-Object -Last 12
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Install package and run real VLC LSL XDF session
        run: |
          $setup = (Resolve-Path 'build/package/out/VLC_ExperimentRunner_Setup_0.1.0_x64.exe').Path
          $install = Join-Path $env:RUNNER_TEMP 'VLCExperimentRunnerInstalled'
          $process = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install"
          ) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:FLUBBERCORDER_APP = Join-Path $install 'app/app.py'
          & (Join-Path $install 'python/python.exe') 'flubbercorder/test_session.py'
          if ($LASTEXITCODE -ne 0) { throw 'Installed VLC/LSL/XDF session failed' }
          & (Join-Path $install 'python/python.exe') 'flubbercorder/test_session.py' --missing
          if ($LASTEXITCODE -ne 0) { throw 'Missing external stream gate failed' }
          & (Join-Path $install 'python/python.exe') 'flubbercorder/test_session.py' --external
          if ($LASTEXITCODE -ne 0) { throw 'Selected external stream recording failed' }
          & (Join-Path $install 'python/python.exe') 'flubbercorder/test_session.py' --pause
          if ($LASTEXITCODE -ne 0) { throw 'VLC pause/resume session failed' }
          & (Join-Path $install 'python/python.exe') 'flubbercorder/test_session.py' --stop
          if ($LASTEXITCODE -ne 0) { throw 'VLC early-stop session failed' }
          $manifest = Get-Content -LiteralPath (Join-Path $install 'manifest.json') -Raw | ConvertFrom-Json
          foreach ($name in $manifest.PSObject.Properties.Name) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $install $name) -Algorithm SHA256).Hash
            if ($actual -ne $manifest.PSObject.Properties[$name].Value) {
              throw "Installed file hash mismatch: $name"
            }
          }
      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: VLC_ExperimentRunner_Setup_0.1.0_x64
          path: experiments/vlc-flubber/build/package/out/VLC_ExperimentRunner_Setup_0.1.0_x64.exe
          if-no-files-found: error
      - name: Publish validated public prerelease
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vlc-experimentrunner-v0.1.0 `
            'build/package/out/VLC_ExperimentRunner_Setup_0.1.0_x64.exe' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'VLC ExperimentRunner 0.1.0 (Flubbercorder side project)' `
            --notes-file 'flubbercorder/RELEASE-NOTES.md' `
            --prerelease
