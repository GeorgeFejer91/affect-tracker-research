name: Package unqualified internal desktop alphas

run-name: Unqualified internal Windows, macOS, and Linux package candidates

on:
  workflow_dispatch:

permissions:
  contents: read

# The packages contain no GStreamer runtime and build without optional Cargo
# features. This workflow has no publishing, release, updater, signing,
# notarization, or research-readiness authority.
jobs:
  package-unqualified-internal-alpha:
    name: ${{ matrix.target }} (unqualified internal alpha)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            platform: windows
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            platform: macos
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            platform: macos
            architecture: x64
          - target: linux-x64
            runner: ubuntu-22.04
            platform: linux
            architecture: x64
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Confirm Unix host-native runner architecture
        if: matrix.platform != 'windows'
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          case "$EXPECTED_PLATFORM/$EXPECTED_ARCHITECTURE" in
            macos/arm64) test "$(uname -s)/$(uname -m)" = "Darwin/arm64" ;;
            macos/x64) test "$(uname -s)/$(uname -m)" = "Darwin/x86_64" ;;
            linux/x64) test "$(uname -s)/$(uname -m)" = "Linux/x86_64" ;;
            *) exit 1 ;;
          esac
      - name: Confirm Windows host-native runner architecture
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') {
            throw 'The Windows package must be built on a native Windows x64 runner.'
          }
      - name: Install exact Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xdg-utils
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          components: rustfmt
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}-no-default-features
      - name: Run frontend tests
        run: pnpm test
      - name: Build focused desktop frontend
        run: pnpm desktop:build
      - name: Check Rust without Windows-only or LSL features
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Test Rust without Windows-only or LSL features
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Build unsigned host-native package candidate
        run: node scripts/build-unqualified-desktop-package.js ${{ matrix.target }}
      - name: Write exact unqualified artifact provenance
        run: >-
          node scripts/write-unqualified-package-provenance.js
          ${{ matrix.target }}
          --output
          src-tauri/target/release/bundle/unqualified-${{ matrix.target }}-provenance.json
      - name: Upload macOS workflow artifact only
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affect-research-0.4.0-alpha.1-unqualified-internal-${{ matrix.target }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/unqualified-${{ matrix.target }}-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Windows workflow artifact only
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affect-research-0.4.0-alpha.1-unqualified-internal-${{ matrix.target }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/unqualified-${{ matrix.target }}-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Linux workflow artifacts only
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affect-research-0.4.0-alpha.1-unqualified-internal-${{ matrix.target }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/unqualified-${{ matrix.target }}-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
