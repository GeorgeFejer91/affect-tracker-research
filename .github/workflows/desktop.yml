name: Affect Research Windows checks

on:
  push:
    branches: [main, research/video-protocol-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level=moderate
      - name: Run Research tests
        run: pnpm surveyjs:check && pnpm test
      - name: Build focused Pages application
        run: pnpm build:pages
      - name: Build focused desktop WebView
        run: pnpm desktop:build
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check native Research backend without optional features
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Compile native Research tests without optional features
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --no-run
      - name: Lint native Research backend without optional features
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Check native Research backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Compile native Research tests with all features
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features --no-run
      - name: Lint native Research backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-features

  suite-installer:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Check out exact suite source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: windows-suite
      - name: Check suite configuration
        run: pnpm suite:windows:check
      - name: Build unsigned, unqualified Planner and Runner installer
        run: pnpm suite:windows:build
      - name: Install and audit exact suite files on the ephemeral runner
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one suite installer.' }
          $destination = Join-Path $env:RUNNER_TEMP 'affect-research-suite-installed'
          if (Test-Path -LiteralPath $destination) { throw 'Install destination must be fresh.' }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP 'affect-suite-install-failure.txt'
            if (Test-Path -LiteralPath $failure) { Get-Content -LiteralPath $failure }
            if (Test-Path -LiteralPath $destination) {
              Get-ChildItem -LiteralPath $destination -Recurse -File | Select-Object -ExpandProperty FullName
            }
            throw "Suite installation failed: $($process.ExitCode)"
          }
          node scripts/qualification/windows-suite-installed-audit.mjs --app-dir $destination --expected-commit $env:GITHUB_SHA --verify-launcher --verify-media-tools
          if ($LASTEXITCODE -ne 0) { throw 'Installed suite file audit failed.' }
          $reinstall = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -PassThru -Wait
          if ($reinstall.ExitCode -ne 0) { throw "Suite reinstall failed: $($reinstall.ExitCode)" }
          node scripts/qualification/windows-suite-installed-audit.mjs --app-dir $destination --expected-commit $env:GITHUB_SHA --verify-launcher --verify-media-tools
          if ($LASTEXITCODE -ne 0) { throw 'Reinstalled suite file audit failed.' }
          $shortcuts = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Affect Research Suite'
          if (Test-Path -LiteralPath (Join-Path $shortcuts 'Affect Research Suite.lnk')) { throw 'Reinstall left a duplicate Planner shortcut.' }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($entry in @(@('Experiment Planner.lnk', 'Experiment Planner.exe'), @('Experiment Runner.lnk', 'Experiment Runner.exe'))) {
            $path = Join-Path $shortcuts $entry[0]
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Suite shortcut missing: $($entry[0])" }
            $target = $shell.CreateShortcut($path).TargetPath
            if ($target -ne (Join-Path $destination $entry[1])) { throw "Suite shortcut target mismatch: $($entry[0])" }
          }
          $ffmpeg = Join-Path $destination 'ffmpeg/bin/ffmpeg.exe'
          $ffprobe = Join-Path $destination 'ffmpeg/bin/ffprobe.exe'
          $source = Join-Path $env:RUNNER_TEMP 'suite-tool-smoke.avi'
          $playable = Join-Path $env:RUNNER_TEMP 'suite-tool-smoke.mp4'
          & $ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc=size=64x64:rate=10 -t 0.5 -c:v mpeg4 -f avi $source
          if ($LASTEXITCODE -ne 0) { throw 'Installed FFmpeg could not create the source fixture.' }
          & $ffmpeg -nostdin -hide_banner -loglevel error -i $source -map 0:v:0 -c:v libx264 -pix_fmt yuv420p -movflags +faststart -f mp4 $playable
          if ($LASTEXITCODE -ne 0) { throw 'Installed FFmpeg could not prepare a playable sibling.' }
          $codec = (& $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nokey=1:noprint_wrappers=1 $playable).Trim()
          if ($LASTEXITCODE -ne 0 -or $codec -ne 'h264') { throw 'Installed FFprobe did not recognize H.264 output.' }
      - name: Upload suite candidate for installed verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affect-research-suite-unqualified-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
