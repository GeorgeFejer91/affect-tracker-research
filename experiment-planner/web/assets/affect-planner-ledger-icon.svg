<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Experiment Planner Ledger</title>
  <desc id="description">A colorful affect ledger seen from the side, with layered pages, index tabs, and affect measurement axes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15182a"/>
      <stop offset="1" stop-color="#080a11"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#353866"/>
      <stop offset="0.58" stop-color="#222543"/>
      <stop offset="1" stop-color="#17192d"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#c8c3b9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="208" fill="url(#background)"/>
