[package]
name = "flubber-libvlc-prototype"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Isolated LibVLC video and native SVG Flubber stability prototype"

[dependencies]
labstream = "0.1.0"
libloading = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
