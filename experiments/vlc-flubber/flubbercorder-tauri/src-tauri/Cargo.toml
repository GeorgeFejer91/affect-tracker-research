[package]
name = "flubbercorder-tauri"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Local FlubberRecorder companion shell"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
